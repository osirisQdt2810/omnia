# LLM + TTS provider config for the smart_notes feature (and any future AI feature).
#
# The [llm] block has ONE subsection per provider ([llm.gemini_vertex], [llm.openai], …):
# `provider` selects which one is active, so you only fill in the credentials for the
# provider you actually use. The live file is user_files/config/providers.toml (gitignored,
# preserved across add-on updates); this *.example.toml is only the seed template. NEVER put a
# raw key here — reference it instead: `secret:<name>` reads the value from .secrets/<name>, and
# `secret-file:<name>` resolves to the .secrets/<name> path (for a service-account JSON). The
# free defaults (google_translate / edge_tts) need no key.

[llm]
# provider: gemini_vertex | gemini | openai | openrouter | custom:<an endpoint's name> (below)
provider = "gemini_vertex"

# Gemini via Vertex AI (GCP project + a service account) — the provider used in production.
# Also supplies the Google auth reused by the google_cloud TTS provider below.
[llm.gemini_vertex]
project = ""                # GCP project id, e.g. "vio-ai-500116"
location = "global"         # "global" for Gemini 3.x; a region like "us-central1" otherwise
# Auth — set exactly ONE of these two (the add-on never shells out to the gcloud CLI):
credentials_path = ""       # e.g. "secret-file:llm.gemini_vertex.credentials_path.json" (JSON in .secrets/)
access_token = ""           # paste a short-lived OAuth token directly
# Model ids:
text_model = "gemini-2.5-flash"
image_model = ""            # e.g. "gemini-2.5-flash-image"
embedding_model = ""        # e.g. "gemini-embedding-001"

# Gemini via AI Studio (a GOOGLE_API_KEY instead of a GCP project).
# NOTE: never inline the raw key — set `api_key = "secret:llm.gemini.api_key"` and store the
# value in .secrets/llm.gemini.api_key (the .secrets/ dir is gitignored, under user_files/config).
[llm.gemini]
api_key = ""
# Google retires model ids from under you: "gemini-2.0-flash" shipped here and now answers
# 404 "no longer available to new users". If generation starts failing with Not Found, list what
# your key can actually reach —
#   curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=$KEY"
# — then CONFIRM the one you pick with a real call, because ListModels still lists retired ids:
#   curl -s -X POST ".../v1beta/models/<id>:generateContent?key=$KEY" \
#        -H 'Content-Type: application/json' -d '{"contents":[{"parts":[{"text":"hi"}]}]}'
text_model = "gemini-3.6-flash"
image_model = ""
embedding_model = ""

# OpenAI (api.openai.com).
[llm.openai]
api_key = ""
base_url = "https://api.openai.com/v1"
text_model = "gpt-4o-mini"
image_model = "gpt-image-1"
embedding_model = "text-embedding-3-small"

# OpenRouter (OpenAI-compatible aggregator). Use `api_key = "secret:llm.openrouter.api_key"`
# (value in .secrets/), not a raw key here.
[llm.openrouter]
api_key = ""
base_url = "https://openrouter.ai/api/v1"
text_model = "openai/gpt-4o-mini"
image_model = "gpt-image-1"
embedding_model = "text-embedding-3-small"
# Prompt caching: every note of a note type sends the same instruction head, so it is worth
# caching. OpenAI-hosted models do that automatically and need nothing here. Anthropic-family
# models need an explicit marker, which requires sending the message as a content ARRAY —
# set this true ONLY for a model documented to accept it, since one that does not will fail
# outright rather than fall back.
prompt_cache_control = false
# Ask for JSON matching a schema (`response_format`) when Omnia batches several notes into one
# request. Same caveat as above: support is per model, and a model that rejects it fails the
# call. Leaving this false is safe — the reply is parsed defensively regardless.
json_output = false

# A server of your own — vLLM, llama.cpp, Ollama, LM Studio, or any other that speaks the
# OpenAI API — is a NAMED endpoint, and you can have as many as you like. The easy way to add
# one is Smart Notes → ⚙ Options → Usage & Keys → 🔑 Keys → Add endpoint: it writes a table
# like the one below and keeps the token in .secrets/ rather than here. Each is chosen by name,
# as `provider = "custom:<name>"` above or per field in Smart Notes.
#
# Fill in BOTH fields. api_key is required even when your server does not check one — Ollama
# and an unauthenticated llama.cpp accept anything, but the provider refuses to build without a
# value, so put a placeholder like "local" there. (A real key, if your server asks for one.)
#
# docs/guidance/local-server/README.md walks through it. Never put a real base_url or key in
# this example: THIS repo is public. Real values belong in user_files/config/providers.toml,
# which is gitignored.
#
# [llm.custom.my-gpu-box]
# base_url = "https://<your-server>/v1"   # the address, ending in /v1
# api_key = "<the token>"                 # any text, if the server has no tokens
# text_model = ""                         # ↻ Load models on its card lists what it serves
# image_model = ""                        # only if it serves /images/generations
#
# The single [llm.openai_compatible] slot this file used to carry is retired: one with an
# address in it becomes the endpoint "Self-hosted" the first time this version starts.

# TTS uses the SAME per-provider shape as [llm]: [tts].provider selects which subsection is
# active, so you only fill in the fields for the provider you use.
[tts]
# provider: google_translate | openai | openrouter | openai_compatible | google_cloud | edge_tts | piper
provider = "google_translate"

# How fast every generated voice speaks, as a multiplier of its natural pace (0.5–2.0).
# A Smart Notes sound field can override this per field; most people set it once here.
# google_translate is the exception: its endpoint has only a slow mode, so anything below
# 0.9 is slow and everything else is normal.
#
# [tts.google_cloud] speaking_rate predates this and still applies: a request that asks for
# no rate of its own (this setting left at 1.0, and no per-field pace) keeps using it. Set the
# rate in ONE of the two places — a speaking_rate of 1.4 cannot be cancelled by choosing 1.0x
# here, because "1.0x" and "no preference" are the same request.
speed = 1.0

# Free, no key (gTTS-style) — the default.
[tts.google_translate]
lang = "en"            # voice language (e.g. en, vi)
tld = "com"            # domain ("com.vn" nudges a Vietnamese accent)

# OpenAI /audio/speech.
[tts.openai]
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini-tts"
voice = "alloy"

# OpenRouter (OpenAI-compatible).
[tts.openrouter]
api_key = ""
base_url = "https://openrouter.ai/api/v1"
model = "gpt-4o-mini-tts"
voice = "alloy"

# Any other OpenAI-compatible /audio/speech endpoint (set base_url).
[tts.openai_compatible]
api_key = ""
base_url = ""
model = "gpt-4o-mini-tts"
voice = "alloy"

# Google Cloud TTS — reuses the [llm.gemini_vertex] Google auth (no extra key).
[tts.google_cloud]
lang = "en"
voice = ""             # e.g. "en-US-Neural2-A"
language_code = ""     # BCP-47 override, e.g. "vi-VN"
speaking_rate = 1.0

# Microsoft Edge neural voices; needs the `edge-tts` package installed.
[tts.edge_tts]
lang = "en"
voice = ""             # e.g. "vi-VN-HoaiMyNeural"

# Local, self-hosted open-source Vietnamese TTS (dangvansam/viet-tts). Run it yourself:
#   pip install viet-tts && viettts server --host 127.0.0.1 --port 8298
# Then point base_url at the running server. Offline + private once started; no cloud key.
[tts.viettts]
base_url = "http://localhost:8298/v1"
model = "tts-1"
voice = ""             # e.g. "nu-nhe-nhang"; empty -> provider default
autostart = true       # auto-start the local viet-tts server on first use (needs viet-tts installed)

# Offline neural TTS. Enable its runtime in Smart Notes -> Options -> Advanced (native runtimes);
# the voice model itself is not packaged and downloads itself into user_files on first use.
[tts.piper]
model = ""             # voice name (e.g. "vi_VN-vais1000-medium") or a path to a .onnx; empty -> default
