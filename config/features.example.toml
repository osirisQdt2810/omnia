# Default per-feature settings (TOML — one table per feature, split from the high-level
# omnia.yaml). Validated by each plugin's Pydantic model in plugins/<plugin>/config.py.

[auto_flip]
delay_question_seconds = 3.0   # seconds to wait before flipping question -> answer
delay_answer_seconds = 3.0     # seconds to wait before auto-grading the answer
wait_for_audio = true          # start the delay only after the card's audio finishes
show_timer = true              # show a small countdown in the reviewer

[typed_accuracy]
threshold = 0.7                # accuracy ratio (0-1) at/above which the answer is a "pass"
pass_ease = "good"             # auto-answer on a pass: "good", "easy", or "no" (a fail always uses Hard)
show_stats = true              # show the interactive accuracy panel on the Statistics screen

[overdue_guard]
ratio = 0.8                    # lateness / interval at/above which a card counts as overdue
min_days = 2                   # minimum days late before the guard can trigger
force_again_after_days = 7     # if the Hard interval would exceed this, force Again (0 = off)

# display_interval has no options.

# Maintenance settings are PER NOTE TYPE — a task option that names a field can only mean
# something inside one note type — and a run maintains every note type you switch on:
#
#   [note_maintenance.note_types."Vocabulary"]
#   enable = true
#   [note_maintenance.note_types."Vocabulary".tasks.strip_ipa]
#   enable = true
#   fields = { Synonyms = "SynonymsNoIPA" }
#
# The settings panel writes that map (every field picked from a dropdown of the note type's
# real fields); a note whose type has no entry is reported in the preview, never guessed at.
#
# The `[note_maintenance.tasks]` tables below are the PRE-note-type global map. They are no
# longer run — they are the starting point the panel offers for a note type you have not
# configured yet, and an older Omnia still runs them, so they are never rewritten.
# One table per task: `enable` (does it run) + `order` (lower runs first) + the task's own
# options. Nothing is ever written without the user confirming the diff first.
# These values MIRROR each task's config model, which is where the defaults actually live — a
# collection-backed profile never reads this file. A test pins the two together.
# `reformat_synonyms` runs BEFORE `strip_ipa`: strip_ipa only understands an already paired
# list ("a (x), b (y)"), so with the other order a collapsed list would need two runs to settle.
[note_maintenance.tasks.reformat_synonyms]
enable = true
order = 10
field = "Synonyms"
strict_count_match = true      # skip the field unless every word has a transcription

[note_maintenance.tasks.strip_ipa]
enable = true
order = 20
fields = { Synonyms = "SynonymsNoIPA" }   # {source = target}; empty target = strip in place

[note_maintenance.tasks.extract_audio_file_name]
enable = true
order = 30
fields = { "Dictionary Definition Audio" = "Dictionary Definition AudioNoTag", "First Example Audio" = "First Example AudioNoTag" }

[note_maintenance.tasks.fill_first_example]
enable = true
order = 40
source_field = "Clozed First Example"
target_field = "First Example"
threshold = 0.75               # word-similarity (0-1) at/above which the two count as the same

[note_maintenance.tasks.replace_text_all_fields]
enable = false                 # off until you say WHAT to replace (an empty `find` is a no-op)
order = 90
find = ""
replace = ""
