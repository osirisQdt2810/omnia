# CI on main: the suite across every supported OS and Python, plus the coverage badge.
#
# Why this exists separately from pr-pipeline.yml: that workflow triggers ONLY on
# `pull_request`, so it has never once run on main — and a workflow badge asking for
# `?branch=main` finds no run and renders "no status". The README badge was structurally
# unable to fill. The same gap left codecov with PR-branch uploads and nothing on main.
#
# The suite itself lives in scripts/run_tests.sh so this and pr-pipeline.yml cannot drift.
#
# The coverage badge is self-hosted on purpose: it is generated here and published to the
# orphan `badges` branch, which shields.io reads. Codecov's tokenless upload is refused
# ("Token required - not valid tokenless upload"), and `fail_ci_if_error: false` meant that
# refusal passed silently for weeks. A badge nobody has to hold a token for cannot rot that way.

name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/requirements-dev.txt
      - name: Install dev tooling
        run: pip install -r requirements/requirements-dev.txt
      - name: Run test suite
        run: bash scripts/run_tests.sh

  coverage:
    name: Coverage badge
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # publishes the badge JSON to the `badges` branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/requirements-dev.txt
      - name: Install dev tooling
        run: pip install -r requirements/requirements-dev.txt
      - name: Measure coverage
        run: bash scripts/run_tests.sh --cov=src/omnia --cov-report=xml --cov-report=term:skip-covered
      - name: Build the shields.io endpoint payload
        run: python scripts/coverage_badge.py coverage.xml badge/coverage.json
      - name: Publish to the badges branch
        # An ORPHAN branch, so a badge refresh on every push to main never touches main's
        # history — and a force-push there can lose nothing but the previous badge.
        run: |
          cd badge
          git init -q
          git checkout -qb badges
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qam "coverage badge for ${GITHUB_SHA::7}" --allow-empty
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            badges
