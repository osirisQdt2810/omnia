# Publish the built `.ankiaddon` for a main commit whose CI went green.
#
# The artifact is the same one `scripts/build_addon.py` produces locally — source package +
# vendor + config templates, minus the TTS weights — so what a machine installs is what this
# repo builds, not a hand-assembled folder someone copied over.
#
# **Why `workflow_run` and not `push`.** A `push: main` trigger would start this alongside the
# suite and finish first (zip + upload is about a minute; the Windows leg of CI is five), so a
# one-liner pushed straight to main — which CLAUDE.md allows for small edits, bypassing the PR
# pipeline — could be the newest Release before its own test run went red. The machine that then
# installs it is the test box this exists for.
#
# **Why not a job inside ci.yml behind `needs: test`.** That orders it correctly and still leaves
# it killable: ci.yml's workflow-level `cancel-in-progress: true` cancels the ENTIRE in-flight
# run when a newer push arrives, every job included, and a job-level concurrency group does not
# exempt it — it only gives that job its own queue. A cancellation landing between
# `gh release create` and the asset upload leaves a tag with nothing on it, and the retry path
# below lives inside the job that just got killed. Here the publish gets a run of its own that
# `ci-main` cannot reach.
#
# **Why not AnkiWeb.** It has no public upload API; automating its private endpoint means driving
# a login session from CI, and an Anki maintainer has said on the official forum that the Terms
# do not currently permit third-party API access. That is the account owner's call to take
# deliberately, not something to arrange quietly inside a workflow. A Release is also additive
# where AnkiWeb is not: it keeps exactly one published build per branch, so an upload replaces
# what every existing user gets on their next update check.
#
# Docs-only and test-only commits publish nothing: there is no new add-on in them, and a release
# per README typo trains everyone to ignore the release list.

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release-main
  cancel-in-progress: false # a release half-created is worse than one that waits

permissions:
  contents: write # creates the release and uploads the asset

jobs:
  publish:
    name: Build and publish
    # Only for a green CI run on main. A red run means the commit is not shippable, and a green
    # one on a branch is not what anyone installs.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The commit CI actually tested. `github.sha` in a workflow_run is the default branch's
      # tip at dispatch time, which drifts the moment another merge lands — the asset and the
      # tag would then describe different code.
      BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Two commits, so the push can be diffed against what it replaced. LFS is deliberately
          # OFF: the only LFS files are the `.onnx` voice weights, which the build excludes —
          # pulling 60 MB to throw it away would cost every run.
          fetch-depth: 2
          lfs: false

      - name: Decide whether there is anything to publish
        id: scope
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"; echo "$changed"
          # Anything outside these paths ends up in the add-on a user runs. The `.md` rule is
          # deliberately TOP-LEVEL only (`^[^/]*\.md$`): `models/piper/README.md` and
          # `vendor/README.md` are packaged, and the first is where the hand-drop-an-`.onnx`
          # workaround is written down — a build that shipped a stale copy of that would be a
          # build that lies about how to fix a broken voice.
          shipped=$(printf '%s\n' "$changed" | grep -vE '^(tests/|docs/|\.claude/|\.github/|requirements/|deploy/)|^[^/]*\.md$' || true)
          if [ -z "$shipped" ]; then
            echo "Only docs/tests changed — nothing to publish."
            echo "ship=false" >> "$GITHUB_OUTPUT"
          else
            echo "ship=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.ship == 'true'
        with:
          python-version: "3.13"

      - name: Name the release
        if: steps.scope.outputs.ship == 'true'
        id: name
        run: |
          # Calendar-versioned like Anki itself (YY.MM), with the run number as the serial so two
          # merges in one month cannot collide. The MONTH half must be a real month: the AnkiWeb
          # upload form silently clamps an impossible one and the server then rejects the whole
          # upload with a 400 and an empty body, which costs hours to diagnose.
          echo "tag=v$(date -u +%y.%m).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build the add-on
        if: steps.scope.outputs.ship == 'true'
        env:
          # Stamped into the shipped manifest as `human_version`, which is what Anki shows beside
          # the add-on — the only way someone at another machine can tell which build they have.
          OMNIA_BUILD_VERSION: ${{ steps.name.outputs.tag }}
        run: python scripts/build_addon.py

      - name: Publish the release
        if: steps.scope.outputs.ship == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          notes="Built from ${BUILT_SHA}.

          $(git log -1 --pretty=%s "${BUILT_SHA}")

          Install: Anki → Tools → Add-ons → Install from file… and pick \`omnia.ankiaddon\`."
          # --target pins the tag to the commit this job BUILT. Without it `gh` creates the tag
          # from whatever main points at when the call lands, so a merge that arrived while this
          # run was working would leave the tag resolving to code the asset does not contain —
          # and the next person bisecting a bad build reads the wrong diff.
          #
          # The `||` branch makes a re-run idempotent. `run_number` is fixed across re-runs, so
          # "Re-run failed jobs" after a transient upload failure would otherwise hit
          # "release already exists" forever, and the only way out would be deleting the release
          # by hand — exactly the manual step this exists to remove.
          gh release create "$TAG" dist/omnia.ankiaddon \
            --target "${BUILT_SHA}" \
            --title "$TAG" \
            --notes "$notes" \
          || gh release upload "$TAG" dist/omnia.ankiaddon --clobber
