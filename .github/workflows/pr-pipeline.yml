# PR pipeline: tests + lint -> Claude review -> gated auto-merge.
#
# Merge gate — a PR auto-merges ONLY when ALL of these hold:
#   1. tests + lint are green on the PR's head commit,
#   1b. the PR description carries every section of the PR template,
#   2. the Claude review job produced an explicit APPROVE verdict for this run
#      (missing/garbled verdict counts as BLOCKING — the gate fails closed),
#   3. the PR carries the `automerge` label at merge time (the human/author
#      intent switch: omit it and the pipeline is review-only, merge manually),
#   4. the head commit at merge time is exactly the one this run reviewed
#      (--match-head-commit blocks TOCTOU pushes mid-run).
# Fork PRs cannot read the review secret, so the review job fails closed and
# `needs` blocks the merge job; fork runs also get a read-only GITHUB_TOKEN.
#
# One-time repo setup (see the PR that introduced this file):
#   - install the Claude GitHub App on the repo,
#   - add the CLAUDE_CODE_OAUTH_TOKEN actions secret (`claude setup-token`),
#   - create the `automerge` label.
#
# Known limitation (by design): a PR that MODIFIES any .github/workflows file
# cannot pass the review job — the Claude GitHub App refuses to mint a token
# when the workflow content differs from the default branch (anti-tampering).
# Such PRs always need a manual merge.

name: PR Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]

concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        # One shell across all three OSes (the pytest command spans lines).
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # The omnia ecosystem targets Windows, macOS AND Linux; 3.13 is Anki's
        # bundled Python everywhere, so every OS runs it.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
        include:
          # EVERY interpreter between the supported minimum and the bundled one gets a leg.
          # Testing only the two ends left 3.11/3.12 as an untested middle, and that gap has
          # now shipped bugs twice — most recently a `mappingproxy` dataclass default that is
          # legal from 3.12 but raises at class-creation time on 3.11, which stopped the whole
          # add-on from importing. A missing version leg does not fail loudly; it fails on a
          # user's machine.
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so pre-commit can diff against the PR base commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/requirements-dev.txt
      - name: Install dev tooling
        run: pip install -r requirements/requirements-dev.txt
      - name: Lint (pre-commit on the PR's changes, pinned hooks)
        # Changed files only — mirrors the local staged-files hook behavior.
        # One lint leg is enough; ubuntu avoids Windows CRLF noise.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: >-
          pre-commit run --show-diff-on-failure
          --from-ref ${{ github.event.pull_request.base.sha }}
          --to-ref HEAD
      - name: Run test suite
        # Vendored deps come from the committed vendor/universal; keyed provider tests
        # auto-skip without creds. The invocation itself lives in the script so this and
        # ci.yml cannot drift apart.
        run: bash scripts/run_tests.sh

  pr-body:
    name: PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # A template only PRE-FILLS the web UI — `gh pr create --body` bypasses it entirely, and
      # that is how most of this repo's PRs are opened. So the format is checked here rather
      # than hoped for. Headings only: what goes UNDER them is a judgement call a grep cannot
      # make, but a missing section is unambiguous.
      - name: Require the template's sections
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Normalise before matching: the GitHub web editor stores CRLF and readily leaves a
          # trailing space on a heading line. Neither changes what the heading SAYS, and a
          # format check that fails on invisible characters teaches people to ignore it.
          normalised=$(printf '%s' "$BODY" | tr -d '\r' | sed 's/[[:space:]]*$//')
          missing=()
          while IFS= read -r heading; do
            [ -z "$heading" ] && continue
            grep -qxF "$heading" <<< "$normalised" || missing+=("$heading")
          done <<'HEADINGS'
          ## Context
          ## Content / Changes
          ## Test Plan
          ### Test Details
          ### Test Output / Feature Demonstration
          HEADINGS
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'PR description is missing required section(s):\n'
            printf '  %s\n' "${missing[@]}"
            printf '\nStart from .github/pull_request_template.md and keep every heading.\n'
            printf 'A section that does not apply gets "N/A — <reason>", not a deletion.\n'
            printf '\nAfter fixing the description, re-run this by toggling the automerge\n'
            printf 'label — `edited` is deliberately not a trigger, so a typo fix does not\n'
            printf 'restart six test legs and a Claude review.\n'
            exit 1
          fi
          echo "All required sections present."

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/requirements-dev.txt
      - name: Install dev tooling
        run: pip install -r requirements/requirements-dev.txt
      - name: Measure coverage
        # Its own job rather than a flag on the matrix: the six test legs exist to catch
        # version- and OS-specific breakage and should stay as fast as possible, and coverage
        # only needs measuring once. Deliberately NOT a merge gate — see requirements-dev.
        run: bash scripts/run_tests.sh --cov=src/omnia --cov-report=xml --cov-report=term:skip-covered
      - name: Report the coverage percentage
        # The README badge is published from ci.yml (push to main); this only prints the number
        # so a reviewer can see the effect of a PR without opening an external service.
        #
        # Codecov upload removed: it was refused with "Token required - not valid tokenless
        # upload" on EVERY run, and `fail_ci_if_error: false` made that refusal look like
        # success — the badge read "unknown" for weeks while the job was green. Restore it by
        # adding a CODECOV_TOKEN secret and passing `token:`; do not restore it tokenless.
        run: python scripts/coverage_badge.py coverage.xml /tmp/coverage-badge.json

  review:
    name: Claude review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      # Either credential works: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`,
      # billed to the Claude subscription) or ANTHROPIC_API_KEY (console.anthropic.com,
      # pay-as-you-go — independent of any claude.ai workspace/plan).
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    outputs:
      verdict: ${{ steps.verdict.outputs.value }}
    steps:
      - name: Fail closed when the review credential is missing
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is available (unset, or this is a fork PR). Refusing to skip review while auto-merge is possible."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Review the PR
        uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        env:
          # Explicit gh auth: comments post as github-actions[bot], whose events
          # can never retrigger workflows — no self-trigger loops.
          GH_TOKEN: ${{ github.token }}
        with:
          # ONE credential, not two. An unset secret renders as an EMPTY STRING, so passing
          # both made the action set ANTHROPIC_API_KEY="" whenever that secret was absent —
          # and the SDK treats a present-but-blank api key as the credential to use rather
          # than falling back to the OAuth token. It then fails to resolve authentication
          # before making any request at all: 44ms, one turn, $0 spent, and a stack trace
          # that names neither secret. Pass only the one this repo actually uses.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            House rules to enforce (this is an Anki add-on with a pluginized architecture):
            - plugins/* may import core/*; core/* must NEVER import plugins/*; plugins must
              NEVER import each other. Shared logic goes into core/.
            - Pure logic modules must not import aqt/anki at top level (tests run headless).
            - Vendored dependencies must be pure-Python and cross-platform (macOS + Windows).
            - Config access only through the namespaced ConfigStore, never raw addonManager calls.
            - The Qt main thread must never block on network/LLM/TTS work.
            - New behavior needs tests; changed behavior needs updated tests.

            Inspect the change with `gh pr diff` and `gh pr view`, and read the surrounding
            code in the checkout for context. Judge correctness (state a concrete failing
            scenario for every defect you claim), architectural fit, test coverage, and the
            house rules above.

            Post your findings as a single `gh pr comment`: for a clean PR, a short summary of
            what you checked; for a defective PR, each blocking issue with file:line, the
            concrete failure scenario, and a suggested fix.

            MANDATORY: the comment's LAST line must be exactly one of
              VERDICT: APPROVE
              VERDICT: BLOCKING
            (the merge gate machine-reads it). Additionally, also write the same word to the
            verdict file: `echo APPROVE > "$RUNNER_TEMP/verdict"` or
            `echo BLOCKING > "$RUNNER_TEMP/verdict"`.
            If neither the marker nor the file exists, the pipeline treats the review as BLOCKING.
          # Opus 5 explicitly: the action's default tier is weaker than what this
          # gate needs — the reviewer is the only thing standing between a bad diff
          # and an automatic merge.
          claude_args: '--model claude-opus-5 --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(echo:*)"'
      - name: Publish verdict
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          v=$(cat "$RUNNER_TEMP/verdict" 2>/dev/null || true)
          if [ -z "$v" ]; then
            echo "No verdict file — falling back to the VERDICT marker in claude[bot]'s comments."
            v=$(gh api "repos/$REPO/issues/$PR/comments" \
                  --jq '[.[] | select(.user.login == "claude[bot]" or .user.login == "claude") | .body] | join("\n")' \
                | grep -oE 'VERDICT: (APPROVE|BLOCKING)' | tail -1 | awk '{print $2}' || true)
          fi
          if [ "$v" != "APPROVE" ]; then v=BLOCKING; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Review verdict: $v"

  merge:
    name: Auto-merge
    needs: [test, pr-body, review]
    if: needs.review.outputs.verdict == 'APPROVE' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge when the automerge label is present
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # Pin the merge to the exact commit this run tested and reviewed.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Re-read labels NOW — the event payload is stale by the time review finishes.
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          if printf '%s\n' "$labels" | grep -qx automerge; then
            gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$HEAD_SHA"
            echo "PR #$PR merged at $HEAD_SHA."
          else
            echo "No automerge label — review is APPROVE but merging is left to a human."
          fi
